# Temporary workflow for a single authorized beta branch. Delete before merging to main.
name: Synchronize beta lockfile (temporary)
on:
  push:
    branches:
      - release/v0.4.0-beta.1
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/sync-lock-on-release-candidate.yml

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.repository == 'geanjhonatan/edge-sidebar-lite'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchronize lockfile with pinned package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify reproducible lockfile
        run: |
          npm run lock:verify
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
      - name: Commit synchronized lockfile to beta branch
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore: synchronize v0.4.0 beta dependency lockfile'
            git push origin HEAD:release/v0.4.0-beta.1
          fi
