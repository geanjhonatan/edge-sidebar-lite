name: Windows installer (test build)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'package*.json'
      - '.github/workflows/windows-installer.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package*.json'
      - '.github/workflows/windows-installer.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify committed dependency lockfile
        run: npm run lock:verify
      - name: Reproducible install
        run: npm ci --no-audit --no-fund
      - name: Source checks and tests
        run: |
          npm run check
          npm test
      - name: Create Windows NSIS installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload Windows installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: edge-sidebar-lite-windows-installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
